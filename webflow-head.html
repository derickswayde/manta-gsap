<!-- Manta motion: head code (Site settings > Custom code > Head code) -->
<script>
  // Mark motion as on before first paint, unless the visitor prefers reduced motion.
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.documentElement.classList.add("manta-motion");
  }
</script>
<style>
  /* Lenis 1.3.27 recommended CSS */
  html.lenis, html.lenis body { height: auto; }
  .lenis:not(.lenis-autoToggle).lenis-stopped { overflow: clip; }
  .lenis [data-lenis-prevent], .lenis [data-lenis-prevent-wheel], .lenis [data-lenis-prevent-touch],
  .lenis [data-lenis-prevent-vertical], .lenis [data-lenis-prevent-horizontal] { overscroll-behavior: contain; }
  .lenis.lenis-smooth iframe { pointer-events: none; }
  .lenis.lenis-autoToggle { transition-property: overflow; transition-duration: 1ms; transition-behavior: allow-discrete; }

  /* Reveal guard: elements that animate in are hidden here (selectors added pass by pass).
     If the script hasn't run within 3s, everything shows anyway. */
  @keyframes manta-motion-fallback { to { visibility: visible; } }
  html.manta-motion:not(.manta-motion-ready) .nav_component,
  html.manta-motion:not(.manta-motion-ready) main > section:first-child :is(.u-heading, .u-text, .u-image-wrapper),
  html.manta-motion:not(.manta-motion-ready) .eyebrow_wrap,
  html.manta-motion:not(.manta-motion-ready) #about :is(.u-heading, .u-text, .u-image-wrapper, .card_icon_wrap),
  html.manta-motion:not(.manta-motion-ready) #analysis :is(.u-heading, .u-text, .carousel_stage),
  html.manta-motion:not(.manta-motion-ready) #analysis > .u-background-slot > *,
  html.manta-motion:not(.manta-motion-ready) #advantage :is(.u-heading, .u-text, .card_feature_wrap),
  html.manta-motion:not(.manta-motion-ready) #team :is(.u-heading, .u-text, .u-image-wrapper, .accordion_item, .card_icon_wrap) {
    visibility: hidden;
    animation: manta-motion-fallback 0s 3s forwards;
  }
</style>
